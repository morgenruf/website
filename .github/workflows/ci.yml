name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-loopback --exclude 'https://status.morgenruf.dev' '**/*.html'
          fail: true

  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate "*.html" || true

  check-css-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every button class used in markup is defined in CSS
        run: ./scripts/check-css-classes.sh index.html

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://morgenruf.dev
            https://morgenruf.dev/support
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
