name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Two flags are needed for this job to report real link health:
          #   --root-dir            resolve root-relative hrefs such as "/privacy"
          #   --fallback-extensions try "<path>.html" for the extensionless pretty
          #                         URLs Netlify serves (/blog/x -> blog/x.html)
          # Without them every internal link errors and the job fails on main
          # whether or not any link is actually broken.
          args: --verbose --no-progress --exclude-loopback --root-dir "$GITHUB_WORKSPACE" --fallback-extensions html --exclude 'https://status.morgenruf.dev' '**/*.html'
          fail: true

  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate "*.html" || true

  check-css-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every button class used in markup is defined in CSS
        run: ./scripts/check-css-classes.sh index.html

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://morgenruf.dev
            https://morgenruf.dev/support
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
