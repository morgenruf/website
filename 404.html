<head>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --indigo: #4f46e5;
      --indigo-light: #ede9fe;
      --indigo-dark: #3730a3;
      --text-head: #111827;
      --text-body: #6b7280;
      --bg-white: #ffffff;
      --bg-cream: #F8F7F4;
      --bg-gray: #f3f4f6;
      --border: #e5e7eb;
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-white);
      color: var(--text-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4 { color: var(--text-head); font-weight: 700; line-height: 1.2; }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
      font-family: 'Inter', sans-serif;
    }
    .btn-indigo { background: var(--indigo); color: #fff; }
    .btn-indigo:hover { background: var(--indigo-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-ghost { background: transparent; color: var(--text-head); border-color: var(--border); }
    .btn-ghost:hover { border-color: #9ca3af; background: var(--bg-gray); }

    /* ===== NAV ===== */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; gap: 16px;
    }
    .nav-logo {
      font-size: 1.3rem; font-weight: 900; color: var(--indigo);
      letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;
    }
    .nav-cta { display: flex; align-items: center; gap: 12px; }

    /* ===== 404 CONTENT ===== */
    .error-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 60px 0;
    }
    .error-bg-dots {
      position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, #d1d5db 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 20%, transparent 70%);
    }
    .error-content {
      position: relative; z-index: 1;
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 900;
      color: var(--indigo);
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 16px;
    }
    .error-heading {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--text-head);
      margin-bottom: 12px;
    }
    .error-sub {
      font-size: 1.05rem;
      color: var(--text-body);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .error-ctas {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--text-head);
      color: #9ca3af;
      padding: 28px 0;
    }
    .footer-bottom {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; font-size: 0.82rem;
    }
    .footer-bottom a { color: #9ca3af; transition: color 0.15s; }
    .footer-bottom a:hover { color: #fff; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .error-ctas { flex-direction: column; }
      .error-ctas .btn { width: 100%; justify-content: center; }
      .nav-cta .btn-ghost-nav { display: none; }
    }
  </style>
</head>
