[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://status.morgenruf.dev https://cloudflareinsights.com https://us.i.posthog.com https://us-assets.i.posthog.com;"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when they are replaced, so they get a month rather
# than the year-long immutable cache /assets/* has (whose URLs carry a hash).
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/mascot.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/mascot.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logo-mark.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logo-mark-68.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-68.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# http://www used to take two hops (to https://www, then to the apex). These
# send both www forms straight to https://morgenruf.dev in one.
[[redirects]]
  from = "http://www.morgenruf.dev/*"
  to = "https://morgenruf.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.morgenruf.dev/*"
  to = "https://morgenruf.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/github"
  to = "https://github.com/morgenruf/morgenruf"
  status = 301

[[redirects]]
  from = "/docs"
  to = "https://docs.morgenruf.dev"
  status = 301

[[redirects]]
  from = "/install"
  to = "https://api.morgenruf.dev/install"
  status = 302

[[redirects]]
  from = "/slack"
  to = "https://api.morgenruf.dev/install"
  status = 302

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Pages are built as <name>/index.html. Netlify serves them at /<name>/ and
# answers /<name> with a 301 to that, so canonicals, the sitemap and internal
# links all use the trailing-slash form. The rewrites to flat <name>.html files
# that used to sit here matched nothing once the site moved to directories.
