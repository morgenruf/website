[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://status.morgenruf.dev;"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/github"
  to = "https://github.com/morgenruf/morgenruf"
  status = 301

[[redirects]]
  from = "/docs"
  to = "https://github.com/morgenruf/morgenruf#readme"
  status = 301

[[redirects]]
  from = "/install"
  to = "https://api.morgenruf.dev/install"
  status = 302

[[redirects]]
  from = "/slack"
  to = "https://api.morgenruf.dev/install"
  status = 302

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/geekbot-alternative"
  to = "/geekbot-alternative.html"
  status = 200

[[redirects]]
  from = "/standup-prosper-alternative"
  to = "/standup-prosper-alternative.html"
  status = 200

[[redirects]]
  from = "/open-source-standup-bot"
  to = "/open-source-standup-bot.html"
  status = 200

[[redirects]]
  from = "/self-hosted-standup-bot"
  to = "/self-hosted-standup-bot.html"
  status = 200

[[redirects]]
  from = "/slack-standup-bot"
  to = "/slack-standup-bot.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/why-i-built-morgenruf"
  to = "/blog/why-i-built-morgenruf.html"
  status = 200

[[redirects]]
  from = "/blog/async-standups-slack-free"
  to = "/blog/async-standups-slack-free.html"
  status = 200

[[redirects]]
  from = "/blog/geekbot-vs-morgenruf"
  to = "/blog/geekbot-vs-morgenruf.html"
  status = 200

[[redirects]]
  from = "/changelog"
  to = "/changelog.html"
  status = 200
